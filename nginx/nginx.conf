events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Security Headers (OWASP)
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http://localhost:5000; script-src 'self' 'unsafe-inline' 'unsafe-eval' http://localhost:3001; style-src 'self' 'unsafe-inline'; font-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com;";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Load Balancing for Backend
    upstream backend_api {
        server backend:5000;
        # In a real cluster, you'd add more instances here:
        # server backend_2:5000;
    }

    server {
        listen 80;
        server_name localhost;

        # Frontend Host App
        location / {
            proxy_pass http://frontend-host:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Frontend Remote App (Dashboard)
        location /dashboard/ {
            proxy_pass http://frontend-remote-dashboard:80/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Backend API Proxy
        location /api/ {
            # Rate limiting configuration can be handled here or in express
            proxy_pass http://backend_api/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
