version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: graminconnect_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - gramin_network

  backend:
    build: ./backend
    container_name: graminconnect_backend
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/graminconnect
      - JWT_SECRET=supersecretjwtkey_for_demo_only
      - FRONTEND_URL=http://localhost
    depends_on:
      - mongodb
    networks:
      - gramin_network

  frontend-host:
    build: ./frontend-host
    container_name: graminconnect_frontend_host
    networks:
      - gramin_network

  frontend-remote-dashboard:
    build: ./frontend-remote-dashboard
    container_name: graminconnect_frontend_remote_dashboard
    networks:
      - gramin_network

  nginx:
    image: nginx:alpine
    container_name: graminconnect_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend-host
      - frontend-remote-dashboard
    networks:
      - gramin_network

volumes:
  mongodb_data:

networks:
  gramin_network:
    driver: bridge
